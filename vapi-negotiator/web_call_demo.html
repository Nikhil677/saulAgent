<!doctype html>
<!-- Talk to any assistant from the browser: no phone number, no telephony limits.
     Open this file directly in Chrome. Use your PUBLIC key only (never the private key). -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Vapi web call tester</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    input {
      width: 100%;
      padding: .5rem;
      margin: .25rem 0 1rem;
      box-sizing: border-box;
    }

    button {
      padding: .6rem 1.2rem;
      margin-right: .5rem;
    }

    #log {
      background: #f4f4f4;
      padding: 1rem;
      height: 280px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: .9rem;
    }
  </style>
</head>

<body>
  <h2>Vapi web call tester</h2>
  <label>Public key <input id="key" placeholder="Vapi PUBLIC key"></label>
  <label>Assistant id <input id="asst"
      placeholder="paste buyer_assistant_id or a vendor assistant_id from state/state.json"></label>
  <button id="start">Start call</button><button id="stop">End call</button>
  <h3>Events</h3>
  <div id="log"></div>
  <script type="module">
    import Vapi from "https://esm.sh/@vapi-ai/web";
    const log = (m) => { const el = document.getElementById("log"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
    let vapi;
    document.getElementById("start").onclick = () => {
      const key = document.getElementById("key").value.trim();
      const id = document.getElementById("asst").value.trim();
      if (!key || !id) return log("Enter the public key and an assistant id.");
      vapi = new Vapi(key);
      vapi.on("call-start", () => log("-- call started --"));
      vapi.on("call-end", () => log("-- call ended --"));
      vapi.on("error", (e) => log("ERROR: " + JSON.stringify(e)));
      vapi.on("message", (m) => {
        if (m.type === "transcript" && m.transcriptType === "final") log(`${m.role}: ${m.transcript}`);
      });
      // Per-call variables, same mechanism the backend uses for outbound calls.
      vapi.start(id, {
        variableValues: {
          vendor_name: "Test Vendor", buyer_org: "a college fest team",
          item_description: "custom printed cotton T-shirts", quantity: "100",
          target_price: "400", walk_away_price: "450", must_haves: "delivery within 10 days",
          deadline: "within 10 days", round_number: "1", competing_quote: "none"
        }
      });
    };
    document.getElementById("stop").onclick = () => vapi && vapi.stop();
  </script>
</body>

</html>
